[project]
name = "whatisi"
version = "0.1.0"
description = "Falsification-driven experiments on persistent deictic self-state in learning systems"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
teacher = ["torch>=2.1", "llama-cpp-python>=0.3", "huggingface-hub>=0.24"]

[tool.setuptools.packages.find]
include = ["whatisi*"]
